name: IronCrypt CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Pin third-party actions to full commit SHAs (Lot 4 supply-chain).
# Tags in comments for human upgrades — re-resolve SHA when bumping.

jobs:
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          key: msrv-1.88
      - name: check library
        run: cargo check --lib --locked
      - name: test library
        run: cargo test --lib --locked

  lint:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bare
            feature_flags: --no-default-features
            target_flags: --lib --bins
          - name: cli-only
            feature_flags: --no-default-features --features cli
            target_flags: --lib --bins
          - name: daemon-only
            feature_flags: --no-default-features --features daemon
            target_flags: --lib --bins
          - name: full
            feature_flags: --features full
            target_flags: --all-targets
          - name: full+gcp
            feature_flags: --features full,gcp
            target_flags: --all-targets
          - name: full+hsm
            feature_flags: --features full,hsm
            target_flags: --all-targets
          - name: all-features
            # all-features enables payment + rsa-algo → compile_error; use full+extras instead
            feature_flags: --features full,gcp,hsm
            target_flags: --all-targets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          key: ${{ matrix.name }}
      - name: clippy (SAST)
        run: cargo clippy ${{ matrix.target_flags }} ${{ matrix.feature_flags }} -- -D warnings

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@7ea888af71a31437ad4e71c62d021b3bb2728ea9 # v2.49.3
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny (default graph)
        run: cargo deny check
      - name: fail on unignored critical crypto advisories (informational severity gate)
        run: |
          # cargo-audit exits non-zero on vulnerable crates not listed in audit.toml.
          cargo audit --deny warnings || true
          cargo audit

  payment:
    name: Payment profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          key: payment
      - name: Install cargo-deny
        uses: taiki-e/install-action@7ea888af71a31437ad4e71c62d021b3bb2728ea9 # v2.49.3
        with:
          tool: cargo-deny
      - name: clippy payment-daemon (no rsa)
        run: cargo clippy --lib --bins --no-default-features --features payment-daemon -- -D warnings
      - name: test payment lib
        run: cargo test --lib --no-default-features --features payment --locked
      - name: Payment deny (ban rsa / no RUSTSEC-2023-0071 ignore)
        run: cargo deny --config deny.payment.toml check

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@7ea888af71a31437ad4e71c62d021b3bb2728ea9 # v2.49.3
        with:
          tool: cargo-cyclonedx
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p target/sbom
          cargo cyclonedx -f json --output-cdx target/sbom/ironcrypt.cdx.json
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: ironcrypt-sbom
          path: target/sbom/ironcrypt.cdx.json

  docs:
    name: Docs + README examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          key: docs
      - name: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: cargo test --doc (includes README.md fences)
        run: cargo test --doc
      - name: cargo build --examples
        run: cargo build --examples

  kat:
    name: Known Answer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          key: kat
      - name: KAT + allowlist unit tests
        run: |
          cargo test --test kat_test --locked
          cargo test --lib crypto_allowlist:: --locked
          cargo test --lib resilience:: --locked

  miri:
    name: Miri (selected lib tests)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          key: miri
      - name: miri selected modules
        run: bash scripts/miri.sh

  cargo_vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install cargo-vet
        uses: taiki-e/install-action@7ea888af71a31437ad4e71c62d021b3bb2728ea9 # v2.49.3
        with:
          tool: cargo-vet
      - name: Ensure supply-chain store present
        run: |
          test -f supply-chain/config.toml
          test -f supply-chain/audits.toml
          test -f supply-chain/imports.lock
      - name: cargo vet --locked
        run: cargo vet --locked

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [msrv, lint, audit, docs, payment, secrets, sbom, kat]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            feature_flags: --features full
          - name: full+gcp
            feature_flags: --features full,gcp
          - name: full+hsm
            feature_flags: --features full,hsm
          - name: payment-daemon
            feature_flags: --no-default-features --features payment-daemon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          key: ${{ matrix.name }}
      - name: Run tests
        run: cargo test ${{ matrix.feature_flags }} --verbose

  build_and_push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@4574d27a4764455b42196d70a065bc6853246a25 # v3.4.0
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

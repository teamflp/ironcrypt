name: IronCrypt CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # Publish to GHCR (uses GITHUB_TOKEN). Avoids Docker Hub PAT scope failures.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # MSRV for the default (library-only) feature set — keep in sync with
  # `package.rust-version` in Cargo.toml.
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      - name: check library
        run: cargo check --lib --locked
      - name: test library
        run: cargo test --lib --locked

  # Explicit feature-combination matrix. `full` (cli+daemon+cloud+interactive)
  # doesn't cover every flag in Cargo.toml — `gcp` and `hsm` are opt-in and
  # excluded from `cloud`/`full` on purpose. Feature unification under a single
  # `--features full` run also silently masks a feature failing to compile on
  # its own (e.g. a feature relying on another enabled dep's transitive
  # features). Each entry below is checked in isolation for that reason.
  # `bare`/`cli-only`/`daemon-only` use `--lib --bins`: the integration test
  # suite assumes a `full`-like environment (tar/flate2/cloud configs, etc.)
  # and isn't meant to build under a minimal feature set.
  lint:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bare
            feature_flags: --no-default-features
            target_flags: --lib --bins
          - name: cli-only
            feature_flags: --no-default-features --features cli
            target_flags: --lib --bins
          - name: daemon-only
            feature_flags: --no-default-features --features daemon
            target_flags: --lib --bins
          - name: full
            feature_flags: --features full
            target_flags: --all-targets
          - name: full+gcp
            feature_flags: --features full,gcp
            target_flags: --all-targets
          - name: full+hsm
            feature_flags: --features full,hsm
            target_flags: --all-targets
          - name: all-features
            feature_flags: --all-features
            target_flags: --all-targets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: clippy
        run: cargo clippy ${{ matrix.target_flags }} ${{ matrix.feature_flags }} -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  docs:
    name: Docs + README examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: cargo test --doc (includes README.md fences)
        run: cargo test --doc
      - name: cargo build --examples
        run: cargo build --examples

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [msrv, lint, audit, docs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            feature_flags: --features full
          - name: full+gcp
            feature_flags: --features full,gcp
          - name: full+hsm
            feature_flags: --features full,hsm
          - name: all-features
            feature_flags: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Run tests
        run: cargo test ${{ matrix.feature_flags }} --verbose

  build_and_push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Publish Crate

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Test library (default = rsa-algo)
        run: cargo test --verbose --lib --tests

      - name: Test full feature set (binaries + cloud)
        run: cargo test --verbose --features full

      - name: Test Payment graph (no rsa)
        run: cargo test --verbose --lib --no-default-features --features payment

      - name: Package dry-run
        run: cargo publish --dry-run --registry crates-io

      - name: Verify version string consistency
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          VERSION_TAG=${VERSION_TAG#v}
          CARGO_VERSION=$(cargo pkgid | sed 's/.*#//')
          if [ "$VERSION_TAG" != "$CARGO_VERSION" ]; then
            echo "Version tag ($VERSION_TAG) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: List packaged files (sanity)
        run: cargo package --list

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io

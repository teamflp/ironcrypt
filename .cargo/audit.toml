# cargo-audit configuration (also mirrored at ./audit.toml for tools that
# only look at the crate root).

[advisories]
ignore = [
  # Marvin Attack; no patched rsa 0.9.x. Track rsa 0.10.
  # https://rustsec.org/advisories/RUSTSEC-2023-0071
  "RUSTSEC-2023-0071",

  # rustc-serialize via optional pkcs11 (hsm). Unmaintained; avoid `hsm` in prod.
  # https://rustsec.org/advisories/RUSTSEC-2022-0004
  "RUSTSEC-2022-0004",

  # rustls-pemfile unmaintained; daemon uses rustls-pki-types; leftover via GCP auth.
  # https://rustsec.org/advisories/RUSTSEC-2025-0134
  "RUSTSEC-2025-0134",

  # Remaining rustls-webpki 0.101.7 via AWS Smithy legacy-rustls 0.21 stack.
  # Primary TLS path uses rustls 0.23 + webpki 0.103.13 (patched).
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
]

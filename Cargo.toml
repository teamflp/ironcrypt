[package]
name = "ironcrypt"
version = "0.1.2"
authors = ["Paterne G. G."]
edition = "2021"
# MSRV for the default (library-only) feature set. Verified in CI.
# Driven mainly by transitive crates in the lockfile (e.g. `time` ≥ 1.88).
# Optional AWS / cloud stacks may require a newer rustc (see README "MSRV").
rust-version = "1.88"
description = "Library-first crypto toolkit: Argon2, AES-256-GCM / XChaCha20 streaming, RSA/ECC hybrid encryption, optional KMS/HSM CryptoProviders, CLI and daemon."
documentation = "https://docs.rs/ironcrypt"
homepage = "https://github.com/teamflp/ironcrypt"
repository = "https://github.com/teamflp/ironcrypt"
license = "MIT"
readme = "README.md"
keywords = ["cryptography", "argon2", "aes-gcm", "kms", "security"]
categories = ["cryptography", "authentication"]
# Keep the crates.io tarball lean: no README assets, Docker/lab stack,
# language SDKs, CI, or local tooling. Source/tests/examples stay included.
exclude = [
    "/images/",
    "/.github/",
    "/.cargo/",
    "/sdks/",
    "/prometheus/",
    "/loki/",
    "/alertmanager/",
    "/nginx/",
    "Dockerfile",
    ".dockerignore",
    "docker-compose.yml",
    "docker-compose.prod.yml",
    "docker-compose.lab.yml",
    "Makefile",
    "audit.toml",
    "deny.toml",
    ".env.example",
]

[package.metadata.docs.rs]
# Document the default (library-only) feature set on docs.rs.
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

[dependencies]
# --- Core (always on) -------------------------------------------------------
aes-gcm = "0.10.3"
aes-gcm-stream = "0.2.4"
argon2 = "0.5.3"
async-trait = "0.1"
base64 = "0.22.1"
byteorder = "1.5.0"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
cipher = "0.4.4"
elliptic-curve = "0.13.8"
hex = "0.4.3"
hkdf = "0.12.3"
hmac = "0.12.1"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
p256 = { version = "0.13.2", features = ["ecdh"] }
pkcs8 = { version = "0.10.2", features = ["pem", "encryption"] }
rand = { version = "0.8.6", default-features = false, features = ["std_rng", "getrandom"] }
rsa = { version = "0.9.10", features = ["pem"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.6"
signature = "2.2.0"
subtle = "2.5.0"
thiserror = "2.0.12"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
toml = "0.8.14"
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
unicode-general-category = "1.0.0"
zeroize = "1.8.1"

# --- Optional: CLI ----------------------------------------------------------
bytes = { version = "1", optional = true }
clap = { version = "4.5.20", features = ["derive", "env"], optional = true }
flate2 = { version = "1.0.30", optional = true }
indicatif = { version = "0.18.0", optional = true }
rpassword = { version = "7.3", optional = true }
tar = { version = "0.4.46", optional = true }
tempfile = { version = "3.20.0", optional = true }

# --- Optional: daemon (ironcryptd) ------------------------------------------
axum = { version = "0.7.5", features = ["ws", "macros", "json"], optional = true }
# Floor for aws-lc-sys / rustls security advisories (daemon TLS stack)
aws-lc-rs = { version = "1.18.1", optional = true }
futures = { version = "0.3", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"], optional = true }
rustls = { version = "0.23.45", optional = true }
rustls-pki-types = { version = "1.9", optional = true }
tokio-rustls = { version = "0.26", optional = true }
tokio-util = { version = "0.7.11", features = ["io-util"], optional = true }
tower = { version = "0.5", features = ["timeout"], optional = true }
tower-http = { version = "0.5.2", features = ["cors", "trace"], optional = true }

# --- Optional: SecretStore backends (opaque secrets) ------------------------
# AWS SDK `rustls` feature = legacy rustls 0.21 / webpki 0.101 (unpatchable CRL DoS).
# Prefer `default-https-client` (rustls 0.23 + aws-lc) only.
aws-config = { version = "1.10", optional = true, default-features = false, features = ["rt-tokio", "credentials-process", "sso", "default-https-client"] }
aws-sdk-secretsmanager = { version = "1.111", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
azure_identity = { version = "0.27.0", optional = true }
azure_core = { version = "0.27.0", optional = true }
azure_security_keyvault_secrets = { version = "0.6.0", optional = true }
google-cloud-secretmanager-v1 = { version = "0.4.5", optional = true }
vaultrs = { version = "0.7.4", optional = true }
redis = { version = "0.27", optional = true }

# --- Optional: CryptoProvider backends (keys never leave the provider) ------
aws-sdk-kms = { version = "1.111", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
cryptoki = { version = "0.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
assert_cmd = "2.0"
# Compiles/runs ```rust``` fences from README.md via `cargo test --doc`.
doc-comment = "0.3"
mockall = "0.12"
predicates = "3.1"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8.6"
sha2 = "0.10.8"
subtle = "2"
tempfile = "3.20.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "crypto_bench"
harness = false


# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------

[lib]
name = "ironcrypt"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "ironcrypt"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "ironcryptd"
path = "src/bin/daemon.rs"
required-features = ["daemon"]

[[test]]
name = "standards_test"
path = "tests/standards_test.rs"

[[test]]
name = "header_limits_test"
path = "tests/header_limits_test.rs"

[[test]]
name = "crypto_provider_config_test"
path = "tests/crypto_provider_config_test.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

# Directory encrypt round-trip uses tar/flate2 (via `cli`).
[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["cli"]

[[test]]
name = "secrets_integration_test"
path = "tests/secrets_integration_test.rs"
required-features = ["aws", "azure"]

# ---------------------------------------------------------------------------
# Features
#
#   SecretStore   → aws | azure | gcp | vault     (get/set opaque secrets)
#   CryptoProvider → aws-kms | vault | hsm        (wrap/unwrap/encrypt in-provider)
#   payment       → locked PaymentSecurityProfile (no extra deps)
#
# Examples:
#   cargo build -p ironcrypt --features "daemon,payment,aws-kms"
#   cargo build -p ironcrypt --features "daemon,payment,hsm"
#   cargo build -p ironcrypt --features full
# ---------------------------------------------------------------------------

[features]
# Library-first default: crypto API + RSA (opt-out for Payment).
# Payment builds MUST use `--no-default-features --features payment…`
# so `rsa-algo` (RUSTSEC-2023-0071) is not linked.
default = ["rsa-algo"]

# --- Meta -------------------------------------------------------------------
# Binaries + interactive CLI + cloud SecretStores + aws-kms (not GCP / not HSM).
full = ["cli", "daemon", "interactive", "cloud", "rsa-algo"]
# SecretStores + AWS KMS. GCP is opt-in (pulls tonic). HSM is opt-in (native PKCS#11).
cloud = ["aws", "aws-kms", "azure", "vault"]
# Payment profile + daemon + preferred DEK backends (pick one KMS/HSM at deploy time).
# Never combine with `rsa-algo` — enforced by compile_error in lib.rs.
payment-daemon = ["payment", "daemon"]
payment-aws = ["payment", "daemon", "aws-kms"]
payment-azure = ["payment", "daemon", "azure-kms"]
payment-gcp = ["payment", "daemon", "gcp-kms"]
payment-vault = ["payment", "daemon", "vault"]
payment-hsm = ["payment", "daemon", "hsm"]

# --- Binaries ---------------------------------------------------------------
cli = ["dep:clap", "dep:tar", "dep:flate2", "dep:tempfile", "dep:rpassword"]
interactive = ["dep:indicatif", "cli"]
# Best-effort mlock on DEK buffers (Unix). Also enabled when IRONCRYPT_MLOCK=1.
mlock = []
daemon = [
    "dep:axum",
    "dep:tower-http",
    "dep:tokio-util",
    "dep:futures",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:aws-lc-rs",
    "dep:rustls-pki-types",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower",
    "dep:clap",
    "dep:bytes",
    "tokio/net",
    "tokio/io-util",
    "tokio/signal",
]

# --- SecretStore ------------------------------------------------------------
aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
azure = ["dep:azure_security_keyvault_secrets", "dep:azure_identity", "dep:azure_core"]
# tonic comes transitively via the GCP client — never a hard core dependency.
gcp = ["dep:google-cloud-secretmanager-v1"]
# Vault KV (SecretStore) and Vault Transit (CryptoProvider) share `vaultrs`.
vault = ["dep:vaultrs", "tokio/rt", "tokio/macros", "tokio/net", "tokio/time"]

# --- CryptoProvider ---------------------------------------------------------
# IAM role / instance profile / IRSA — no static keys in config.
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]
# Azure Key Vault Keys wrap/unwrap (DefaultAzureCredential + REST).
azure-kms = ["dep:azure_identity", "dep:azure_core", "dep:reqwest"]
# Google Cloud KMS encrypt/decrypt (ADC token / IRONCRYPT_GCP_ACCESS_TOKEN + REST).
gcp-kms = ["dep:reqwest"]
# In-device PKCS#11 via maintained `cryptoki` (replaces unmaintained pkcs11 0.2).
hsm = ["dep:cryptoki"]
# Distributed rate limiting for multi-replica ironcryptd (Redis fixed-window).
redis-rate-limit = ["dep:redis", "daemon"]

# --- Algorithms -------------------------------------------------------------
# RSA-OAEP / RSA-PSS (Marvin Attack advisory RUSTSEC-2023-0071 on 0.9.x).
# Disabled for Payment production graphs.
rsa-algo = ["dep:rsa"]

# --- Payment security profile -----------------------------------------------
# ECC-first, no legacy ECIES nonce, forbids Custom crypto + legacy HSM SecretStore.
# Does not enable network backends by itself — combine with payment-aws / -vault / -hsm.
# Incompatible with `rsa-algo` (see compile_error in lib.rs).
# Enables best-effort DEK mlock on Unix (also toggleable via IRONCRYPT_MLOCK=1).
payment = ["mlock"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

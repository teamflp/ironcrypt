[package]
name = "ironcrypt"
version = "0.1.1"
authors = ["Paterne G. G."]
edition = "2021"
# MSRV for the default (library-only) feature set. Verified in CI.
# Driven mainly by transitive crates in the lockfile (e.g. `time` ≥ 1.88).
# Optional `aws` / current Secrets Manager SDK stack may require a newer
# rustc (see README "MSRV" / feature notes).
rust-version = "1.88"
description = "Library-first crypto toolkit: Argon2 password hashing, AES-256-GCM / XChaCha20 streaming, RSA/ECC hybrid encryption, and optional CLI/daemon."
documentation = "https://docs.rs/ironcrypt"
homepage = "https://github.com/teamflp/ironcrypt"
repository = "https://github.com/teamflp/ironcrypt"
license = "MIT"
readme = "README.md"
keywords = ["cryptography", "argon2", "aes-gcm", "rsa", "security"]
categories = ["cryptography", "authentication"]
# Keep the crates.io tarball lean: no README assets, Docker/lab stack,
# language SDKs, CI, or local tooling. Source/tests/examples stay included.
# Real secrets stay gitignored; `*.pem.example` / test fixtures remain for docs & CI.
exclude = [
    "/images/",
    "/.github/",
    "/.cargo/",
    "/sdks/",
    "/prometheus/",
    "/loki/",
    "/alertmanager/",
    "/nginx/",
    "Dockerfile",
    ".dockerignore",
    "docker-compose.yml",
    "docker-compose.prod.yml",
    "docker-compose.lab.yml",
    "Makefile",
    "audit.toml",
    "deny.toml",
    ".env.example",
]

[package.metadata.docs.rs]
# Document the default (library-only) feature set on docs.rs.
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core dependencies - always included
serde = { version = "1.0.228", features = ["derive"] }
argon2 = "0.5.3"
base64 = "0.22.1"
rsa = { version = "0.9.10", features = ["pem"] }
pkcs8 = { version = "0.10.2", features = ["pem", "encryption"] }
serde_json = "1.0"
sha2 = "0.10.6"
thiserror = "2.0.12"
aes-gcm = "0.10.3"
cipher = "0.4.4"
chacha20poly1305 = "0.10.1"
p256 = { version = "0.13.2", features = ["ecdh"] }
elliptic-curve = "0.13.8"
hkdf = "0.12.3"
unicode-general-category = "1.0.0"
zeroize = "1.8.1"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.17.2"
aes-gcm-stream = "0.2.4"
byteorder = "1.5.0"
rand = { version = "0.8.6", default-features = false, features = ["std_rng", "getrandom"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
signature = "2.2.0"
hex = "0.4.3"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8.14"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
subtle = "2.5.0"

# --- Optional Dependencies ---

# CLI feature
clap = { version = "4.5.20", features = ["derive", "env"], optional = true }
tar = { version = "0.4.46", optional = true }
flate2 = { version = "1.0.30", optional = true }
tempfile = { version = "3.20.0", optional = true }

# Interactive feature (for CLI progress bars)
indicatif = { version = "0.18.0", optional = true }

# Daemon feature
axum = { version = "0.7.5", features = ["ws", "macros", "json"], optional = true }
tower-http = { version = "0.5.2", features = ["cors", "trace"], optional = true }
tokio-util = { version = "0.7.11", features = ["io-util"], optional = true }
futures = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
# Floor for RUSTSEC-2026-0045/0046/0047/0048 (aws-lc-sys >= 0.39 via aws-lc-rs)
aws-lc-rs = { version = "1.17.3", optional = true }
rustls-pki-types = { version = "1.9", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"], optional = true }
tower = { version = "0.5", optional = true }

# AWS feature
aws-config = { version = "1.10", optional = true }
aws-sdk-secretsmanager = { version = "1.111", optional = true }
azure_security_keyvault_secrets = { version = "0.6.0", optional = true }
azure_identity = { version = "0.27.0", optional = true }
google-cloud-secretmanager-v1 = { version = "0.4.5", optional = true }

# HSM feature
pkcs11 = { version = "0.2.0", optional = true }

# Vault feature
vaultrs = { version = "0.7.4", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rand = "0.8.6"
sha2 = "0.10.8"
mockall = "0.12"
tempfile = "3.20.0"
# Compiles/runs ```rust``` fences from README.md via `cargo test --doc`.
doc-comment = "0.3"

[lib]
name = "ironcrypt"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "ironcrypt"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "ironcryptd"
path = "src/bin/daemon.rs"
required-features = ["daemon"]

[[test]]
name = "standards_test"
path = "tests/standards_test.rs"
harness = true

# Binary / cloud integration tests are skipped unless the matching features are enabled.
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

# Directory encrypt round-trip uses tar/flate2 (pulled in by the `cli` feature).
[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
required-features = ["cli"]

[[test]]
name = "secrets_integration_test"
path = "tests/secrets_integration_test.rs"
required-features = ["aws", "azure"]

[features]
# Library-first defaults for crates.io: crypto API only.
# Opt in to binaries / cloud with `features = ["cli"]`, `["full"]`, etc.
default = []

# Meta features
full = ["cli", "daemon", "cloud", "interactive"]
# Core cloud backends (no GCP — GCP pulls tonic via its client; enable `gcp` explicitly)
cloud = ["aws", "azure", "vault"]

# CLI features
cli = ["dep:clap", "dep:tar", "dep:flate2", "dep:tempfile"]
interactive = ["dep:indicatif", "cli"]

# Daemon features
daemon = [
  "dep:axum",
  "dep:tower-http",
  "dep:tokio-util",
  "dep:futures",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:aws-lc-rs",
  "dep:rustls-pki-types",
  "dep:hyper",
  "dep:hyper-util",
  "dep:tower",
  "tokio/net",
  "tokio/io-util",
  "dep:clap",
]

# Cloud provider features
aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
azure = ["dep:azure_security_keyvault_secrets", "dep:azure_identity"]
# tonic is pulled transitively by the GCP client — never a hard dependency of the core crate
gcp = ["dep:google-cloud-secretmanager-v1"]
vault = ["dep:vaultrs"]

# Hardware Security Module feature
hsm = ["dep:pkcs11"]
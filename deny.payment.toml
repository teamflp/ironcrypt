# cargo-deny for Payment feature graphs (no rsa / no RUSTSEC-2023-0071 ignore).
#
# CI: cargo deny --config deny.payment.toml check
# Graph: --no-default-features --features payment-daemon (no rsa-algo).

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = true
features = ["payment-daemon"]

[advisories]
yanked = "deny"
# Intentionally empty: Payment must not ignore RUSTSEC-2023-0071.
# The `rsa` crate is banned under [bans] so Marvin Attack cannot re-enter.
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "OpenSSL",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  { crate = "rsa" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
